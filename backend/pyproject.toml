[project]
name = "sunrise-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0",
  "alembic",
  "pydantic>=2",
  "pydantic-settings",
  "psycopg[binary]",
  "python-jose[cryptography]",
  "python-multipart",
  "passlib[bcrypt]",
  "bcrypt==4.0.1",
  "reportlab",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx2", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned deliberately, and narrower than it looks.
#
# With no `select` ruff applies whatever its current default is, and that
# default has widened over releases while CI installs ruff unpinned - so the
# lint rules this project is held to could change without a commit. The first
# CI run met that: 948 errors, of which 547 were B008
# (function-call-in-default-argument) firing on `Depends()` in every route
# signature. That is FastAPI's documented idiom, not a defect, and a rule that
# is wrong 547 times is a rule that trains people to ignore the linter.
#
# E4/E7/E9 (import, statement and syntax errors) plus F (pyflakes: undefined
# names, unused imports, broken f-strings) is ruff's own classic default and
# catches the things that are unambiguously wrong. Widen it deliberately later
# if a rule earns its place; do not inherit a rule set by accident.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# A package __init__ that re-exports is not holding unused imports.
# app/models/__init__.py is the import surface the whole codebase uses
# (`from app.models import User`) and, more to the point, importing every model
# is what registers it on Base.metadata - which is how `create_all` builds the
# test schema at all. Deleting these "unused" imports would empty the metadata
# and take the suite with it. 140 of the 226 findings were this one file.
"**/__init__.py" = ["F401"]

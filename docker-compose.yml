services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sunrise
      POSTGRES_PASSWORD: sunrise
      POSTGRES_DB: sunrise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunrise"]
      interval: 5s
      retries: 10

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:

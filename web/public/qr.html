    .card {

    }

      color: #64748b;
      margin-bottom: 24px;
    }
    .qr-box {
      background: #ffffff;
      padding: 16px;
      display: inline-block;
      border-radius: 12px;
      border: 3px solid #0f172a;
      margin-bottom: 20px;
    }
    .qr-box img {
      display: block;
      width: 280px;
      height: 280px;
      image-rendering: pixelated;
    }
    .url-box {
      background: #f1f5f9;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      color: #0369a1;
      font-weight: 600;
      word-break: break-all;
      border: 1px solid #cbd5e1;
    }
    .instruction {
      margin-top: 14px;
      font-size: 13px;
      color: #64748b;
    }
    .web-link {
      margin-top: 24px;
      color: #94a3b8;
      font-size: 13px;
    }
    .web-link a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
